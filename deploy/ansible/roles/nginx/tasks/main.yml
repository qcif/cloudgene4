---
- name: Install nginx and certbot
  ansible.builtin.apt:
    name:
      - certbot
      - nginx
    state: present

- name: Remove the default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Create the ACME webroot
  ansible.builtin.file:
    path: /var/www/letsencrypt
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check for an existing certificate
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ cloudgene_domain }}/fullchain.pem"
  register: nginx_cert
  when: cloudgene_tls_enabled | bool

- name: Write the HTTP-only site (used to obtain the certificate, or when TLS is off)
  ansible.builtin.template:
    src: cloudgene.conf.j2
    dest: /etc/nginx/sites-available/cloudgene
    owner: root
    group: root
    mode: "0644"
  vars:
    nginx_ssl: false
  when: not (cloudgene_tls_enabled | bool) or not nginx_cert.stat.exists

- name: Enable the site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/cloudgene
    dest: /etc/nginx/sites-enabled/cloudgene
    state: link
  notify: Reload nginx

- name: Start nginx and apply the configuration
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Reload nginx before the ACME challenge
  ansible.builtin.meta: flush_handlers

- name: Obtain the Let's Encrypt certificate
  ansible.builtin.command: >-
    certbot certonly --webroot -w /var/www/letsencrypt
    -d {{ cloudgene_domain | quote }}
    --email {{ cloudgene_letsencrypt_email | quote }}
    --agree-tos --non-interactive
  args:
    creates: "/etc/letsencrypt/live/{{ cloudgene_domain }}/fullchain.pem"
  when: cloudgene_tls_enabled | bool

- name: Write the full HTTPS site
  ansible.builtin.template:
    src: cloudgene.conf.j2
    dest: /etc/nginx/sites-available/cloudgene
    owner: root
    group: root
    mode: "0644"
  vars:
    nginx_ssl: true
  when: cloudgene_tls_enabled | bool
  notify: Reload nginx

- name: Reload nginx when certificates are renewed
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
    content: |
      #!/bin/sh
      systemctl reload nginx
    owner: root
    group: root
    mode: "0755"
  when: cloudgene_tls_enabled | bool

- name: Enable certificate renewal timer
  ansible.builtin.systemd:
    name: certbot.timer
    enabled: true
    state: started
  when: cloudgene_tls_enabled | bool
