---
# Public host name; its DNS A record must point at the VM before the first run.
cloudgene_domain: cloudgene4.qcif.edu.au
cloudgene_letsencrypt_email: c.hyde@qcif.edu.au

# Serve over HTTPS using a Let's Encrypt certificate. This also switches on the secure
# cookie / SSL redirect / HSTS settings in the Django env file.
cloudgene_tls_enabled: true
cloudgene_hsts_seconds: 31536000

cloudgene_repo: https://github.com/qcif/cloudgene4.git
cloudgene_version: rebuild

cloudgene_user: cloudgene
cloudgene_group: cloudgene
cloudgene_root: /opt/cloudgene
cloudgene_home: /var/lib/cloudgene
cloudgene_env_dir: /etc/cloudgene
cloudgene_env_file: "{{ cloudgene_env_dir }}/cloudgene.env"

cloudgene_db_name: cloudgene
cloudgene_db_user: cloudgene
cloudgene_db_password: "{{ vault_cloudgene_db_password }}"
cloudgene_django_secret_key: "{{ vault_django_secret_key }}"

cloudgene_admin_user: admin
cloudgene_admin_email: "{{ cloudgene_letsencrypt_email }}"
# Optional: leave undefined to skip create_admin.
cloudgene_admin_password: "{{ vault_cloudgene_admin_password | default(omit) }}"

# Keep >= settings.yaml server.max_upload_mb (default 1024).
cloudgene_client_max_body_size: 1024m

nextflow_version: 26.10.3
# The plain launcher (not the self-contained "-dist" build) so a per-app NXF_VER is honoured.
nextflow_url: "https://github.com/nextflow-io/nextflow/releases/download/v{{ nextflow_version }}/nextflow"

cloudgene_ufw_enabled: true

# --- Workflows -------------------------------------------------------------------------
# Each entry is downloaded (release zip) into cloudgene_workflows_dir/<id>/, its cloudgene.yml
# is linked to a file in the configs repo, and it is registered with `ensure_workflow`.
# Per-app nextflow.env / nextflow.config are NOT managed here: set them in Admin > Workflows.
# Remove a workflow by setting `state: absent` (then delete the entry once applied).
cloudgene_workflow_configs_repo: https://github.com/qcif/daff-cloudgene.git
cloudgene_workflow_configs_version: main
cloudgene_workflow_configs_dir: /opt/daff-cloudgene
cloudgene_workflows_dir: /opt/cloudgene-workflows

cloudgene_workflows:
  - id: taxodactyl_150_azure          # must match the id in the cloudgene yml
    state: present
    archive_url: https://github.com/qcif/taxodactyl/archive/refs/tags/v1.5.0.zip
    archive_root: taxodactyl-1.5.0    # top-level directory inside the zip
    cloudgene_yml: workflows/taxodactyl-v1.5.0-azure.yml   # path within the configs repo
    enabled: true
    public: true
    groups: []
    profile: azure
    work_dir: az://workdata/wf2
    trust_output: true
